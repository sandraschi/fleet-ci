# Reusable CI: Python-only repos (no frontend)
# Fleet pin: Python 3.12, uv, ruff, pytest

name: Python CI

on:
  workflow_call:
    inputs:
      python-version:
        default: "3.12"
        type: string

jobs:
  check:
    name: Lint & Test (Windows)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          version: "latest"
          enable-cache: true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ inputs.python-version }}

      - name: Detect src directory
        id: src
        shell: pwsh
        run: |
          $src = ''
          foreach ($d in @('src', '.')) {
            $check = if ($d -eq '.') { 'pyproject.toml' } else { (Join-Path $d '__init__.py') }
            if (Test-Path $check) { $src = $d; break }
          }
          "dir=$src" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8NoBOM

      - name: Install Python dependencies
        shell: pwsh
        run: |
          $toml = Get-Content pyproject.toml -Raw -ErrorAction SilentlyContinue
          $hasGroupDev = $false
          $hasExtraDev = $false
          if ($toml) {
            $inGroups = $false
            $inExtras = $false
            foreach ($line in ($toml -split "`n")) {
              $t = $line.Trim()
              if ($t -match '^\[dependency-groups\]\s*$') { $inGroups = $true; $inExtras = $false; continue }
              if ($t -match '^\[project\.optional-dependencies\]\s*$') { $inGroups = $false; $inExtras = $true; continue }
              if ($t -match '^\[') { $inGroups = $false; $inExtras = $false; continue }
              if ($inGroups -and $t -match '^dev\s*=') { $hasGroupDev = $true }
              if ($inExtras -and $t -match '^dev\s*=') { $hasExtraDev = $true }
            }
          }
          if ($hasGroupDev) {
            Write-Host "Using uv sync --group dev (dependency-groups)"
            uv sync --group dev
          } elseif ($hasExtraDev) {
            Write-Host "Using uv sync --extra dev (optional-dependencies)"
            uv sync --extra dev
          } else {
            Write-Host "No dev deps detected, running uv sync without group/extra"
            uv sync
          }

      - name: Verify Ruff
        shell: pwsh
        run: |
          $versionLine = uv run ruff --version 2>&1
          if ($LASTEXITCODE -ne 0) { throw "ruff not installed. Add ruff to [dependency-groups] dev in pyproject.toml" }
          Write-Host "ruff: $versionLine"
          $toml = Get-Content pyproject.toml -Raw -ErrorAction SilentlyContinue
          if ($toml -and $toml -notmatch '(?ms)\[tool\.ruff\.lint\].*?\bselect\s*=') {
            throw "pyproject.toml must define [tool.ruff.lint] select = [...]. Ruff without explicit select enables hundreds of rules."
          }

      - name: Ruff check
        shell: pwsh
        run: |
          $paths = @('src')
          if (Test-Path 'tests') { $paths += 'tests' }
          if (-not (Test-Path 'src') -and (Test-Path '.')) {
            $paths = @('.')
          }
          uv run ruff check @paths

      - name: Ruff format check
        shell: pwsh
        run: |
          $paths = @('src')
          if (Test-Path 'tests') { $paths += 'tests' }
          if (-not (Test-Path 'src') -and (Test-Path '.')) {
            $paths = @('.')
          }
          uv run ruff format --check @paths

      - name: Pytest
        if: hashFiles('tests/**') != ''
        shell: pwsh
        run: |
          $toml = Get-Content pyproject.toml -Raw -ErrorAction SilentlyContinue
          if ($toml -match 'pytest-cov') {
            uv run python -m pytest tests/ -q --tb=short --no-cov
          } else {
            uv run python -m pytest tests/ -q --tb=short
          }

      - name: ty typecheck
        continue-on-error: true
        shell: pwsh
        run: |
          $toml = Get-Content pyproject.toml -Raw -ErrorAction SilentlyContinue
          if (-not $toml) { Write-Host "skip: no pyproject.toml"; exit 0 }
          if ($toml -notmatch '(?m)^\s*"?ty"?\s*[,\]]' -and $toml -notmatch 'ty>=') {
            Write-Host "skip: ty not in dev dependencies"
            exit 0
          }
          uv run ty check src
